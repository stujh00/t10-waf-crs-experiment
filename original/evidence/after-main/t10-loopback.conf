
server {
    listen 127.0.0.1:18081;
    server_name lab.example.test;
    modsecurity on;
    modsecurity_rules_file /etc/nginx/t10/pl1.conf;
    root /var/www/t10;
    index index.html;
    access_log /var/log/nginx/t10-pl1-access.log;
}


