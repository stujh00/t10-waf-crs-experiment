<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>T10 WAF 재현용 시연 페이지</title>
<style>body{font:17px/1.6 sans-serif;max-width:1100px;margin:40px auto;padding:20px;color:#16304a}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}section,aside{border:1px solid #ccd6e0;border-radius:12px;padding:24px}textarea{box-sizing:border-box;width:100%;min-height:100px}button{padding:10px 20px;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}aside{position:sticky;top:20px;align-self:start}@media(max-width:700px){main{display:block}}</style>
<h1>WAF 재현용 시연 페이지</h1>
<p>기존 서버 화면을 복원한 파일이 아니라 같은 검사 경로를 사용하는 별도 시연 페이지입니다. 입력은 결과 영역에 문자로 표시합니다.</p>
<main><section id="forms"></section><aside><h2>실제 서버 응답</h2><pre id="output">요청을 보내면 결과가 표시됩니다.</pre></aside></main>
<script>
for(let pl=1;pl<=3;pl++){
 const form=document.createElement('form');form.action=`/pl${pl}/`;form.method='get';
 const title=document.createElement('h2');title.textContent=`PL${pl}`;
 const field=document.createElement('textarea');field.name='q';field.value='hello';field.setAttribute('aria-label',`PL${pl} 입력`);
 const button=document.createElement('button');button.textContent=`PL${pl} 요청 보내기`;
 form.append(title,field,button);document.querySelector('#forms').append(form);
 form.addEventListener('submit',async event=>{event.preventDefault();const output=document.querySelector('#output');
  try{const response=await fetch(`/pl${pl}/?`+new URLSearchParams({q:field.value}),{cache:'no-store'});
   await response.text();output.textContent=`PL${pl}\nHTTP ${response.status}\n입력: ${field.value}`;
  }catch(error){output.textContent=String(error);}
 });
}
</script></html>
